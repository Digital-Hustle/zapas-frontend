extends:
  - recommended
apis:
  auth-profile:
    root: openapi/auth-profile.yaml
  auth:
    root: openapi/auth.yaml
  orchestrator:
    root: openapi/orchestrator.openapi.yaml
  orchestrator-internal:
    root: openapi/orchestrator-internal.openapi.yaml
  forecast-internal:
    root: openapi/forecast-internal.openapi.yaml
  preprocessor-upload:
    root: openapi/preprocessor-upload.openapi.yaml
rules:
  info-license: off
  operation-4xx-response: off
  security-defined: error
  operation-operationId-unique: error
  no-unused-components: off
  operation-summary: off
  tag-description: off
  no-server-example.com: off
  no-server-trailing-slash: off
