openapi: 3.1.0
x-client-use: Android/native and existing clients; new browser clients use auth-profile.yaml.
info:
  title: Zapas auth
  version: 1.0.0
  description:
    "Auth/Profile: вход, сессии и профиль. Организации и членства принадлежат Orchestrator. JWT проверяет
    только Gateway; auth endpoints жизненного цикла обрабатываются Auth."
servers:
  - url: /api/v1/auth
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: login
  - name: sessions
  - name: me
  - name: companies
  - name: admin
paths:
  /csrf:
    get:
      tags:
        - login
      operationId: bootstrapCsrf
      summary: CSRF bootstrap для pre-login браузерных мутаций
      security: []
      responses:
        "200":
          description: Выдаёт signed/session-bound token и cookie zapas_csrf; не выдаёт сессию
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                  - expiresInSec
                properties:
                  csrfToken:
                    type: string
                  expiresInSec:
                    type: integer
                    minimum: 1
  /code:
    post:
      tags:
        - login
      operationId: requestLoginCode
      summary: Отправить код на email (одинаковый ответ для новых и существующих)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRq"
      responses:
        "202":
          description: Код отправлен (или будет отправлен)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRs"
        "422":
          $ref: _shared.yaml#/components/responses/Unprocessable
        "429":
          $ref: _shared.yaml#/components/responses/TooMany
  /verify:
    post:
      tags:
        - login
      operationId: verifyLoginCode
      summary: Проверить код и открыть сессию
      description:
        "WEB: токены только в HttpOnly Secure cookies. ANDROID: токены в теле. Client/X-Client не доказывает
        роль. Компании после входа запрашиваются в Orchestrator."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRq"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRs"
        "410":
          $ref: _shared.yaml#/components/responses/Unprocessable
        "422":
          $ref: _shared.yaml#/components/responses/Unprocessable
        "429":
          $ref: _shared.yaml#/components/responses/TooMany
  /refresh:
    post:
      tags:
        - sessions
      operationId: refreshSession
      summary: Ротация refresh, новая пара токенов
      security: []
      requestBody:
        description: Только ANDROID; WEB берёт refresh из cookie
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRq"
      responses:
        "200":
          description: Новые токены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRs"
        "401":
          $ref: _shared.yaml#/components/responses/Unauthorized
        "429":
          $ref: _shared.yaml#/components/responses/TooMany
  /logout:
    post:
      tags:
        - sessions
      operationId: logout
      responses:
        "204":
          description: Сессия завершена, cookies очищены
  /sessions:
    get:
      tags:
        - sessions
      operationId: listSessions
      responses:
        "200":
          description: Активные сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsRs"
        "401":
          $ref: _shared.yaml#/components/responses/Unauthorized
    delete:
      tags:
        - sessions
      operationId: revokeOtherSessions
      summary: Завершить все сессии, кроме текущей
      responses:
        "204":
          description: Готово
  /sessions/{sessionId}:
    delete:
      tags:
        - sessions
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: _shared.yaml#/components/schemas/Uuid
      responses:
        "204":
          description: Готово
        "404":
          $ref: _shared.yaml#/components/responses/NotFound
  /me:
    get:
      tags:
        - me
      operationId: getMe
      responses:
        "200":
          description: Текущий пользователь и его профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRs"
        "401":
          $ref: _shared.yaml#/components/responses/Unauthorized
    patch:
      tags:
        - me
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRq"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRs"
        "422":
          $ref: _shared.yaml#/components/responses/Unprocessable
  /me/delete:
    post:
      tags:
        - me
      operationId: deleteMe
      summary: Удалить аккаунт (нужен свежий код из почты)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        "202":
          description: Удаление запланировано
        "422":
          $ref: _shared.yaml#/components/responses/Unprocessable
  /.well-known/jwks.json:
    get:
      tags:
        - sessions
      operationId: getJwks
      security: []
      responses:
        "200":
          description: Публичные ключи ES256
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /internal/v1/auth/users/{userId}:
    get:
      operationId: internalGetAuthUser
      tags:
        - internal
      summary: Существующий активный пользователь для Orchestrator
      description:
        Стык для согласования с владельцем Auth. Только разрешённая внутренняя сеть, без сервисного JWT.
        Не публикуется Gateway.
      servers:
        - url: /
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Состояние пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - active
                additionalProperties: false
                properties:
                  userId:
                    type: string
                    format: uuid
                  active:
                    type: boolean
        "404":
          $ref: _shared.yaml#/components/responses/NotFound
components:
  securitySchemes:
    cookieAuth:
      $ref: _shared.yaml#/components/securitySchemes/cookieAuth
    bearerAuth:
      $ref: _shared.yaml#/components/securitySchemes/bearerAuth
  schemas:
    ClientKind:
      type: string
      enum:
        - WEB
        - ANDROID
    CodeRq:
      type: object
      required:
        - email
        - client
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        client:
          $ref: "#/components/schemas/ClientKind"
    CodeRs:
      type: object
      required:
        - maskedEmail
        - expiresInSec
        - resendAfterSec
        - codeLength
      properties:
        maskedEmail:
          type: string
          examples:
            - an•••@mail.ru
        expiresInSec:
          type: integer
        resendAfterSec:
          type: integer
        codeLength:
          type: integer
          const: 6
        demoCode:
          type: string
          description: Только при AUTH_DEMO_CODE_IN_RESPONSE=true (никогда в prod)
    VerifyRq:
      type: object
      required:
        - email
        - code
        - client
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: ^\d{6}$
        client:
          $ref: "#/components/schemas/ClientKind"
        deviceName:
          type: string
          maxLength: 100
    RefreshRq:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 200
    SessionRs:
      type: object
      required:
        - user
        - accessExpiresAt
        - isNewUser
      properties:
        user:
          $ref: "#/components/schemas/User"
        isNewUser:
          type: boolean
        accessExpiresAt:
          $ref: _shared.yaml#/components/schemas/Instant
        accessToken:
          type: string
          description: Только ANDROID
        refreshToken:
          type: string
          description: Только ANDROID
        csrfToken:
          type: string
          description: WEB/ADMIN — значение для X-CSRF-Token
    User:
      type: object
      required:
        - id
        - email
        - timezone
      properties:
        id:
          $ref: _shared.yaml#/components/schemas/Uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        timezone:
          type: string
          examples:
            - Europe/Moscow
    MeRs:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"
    UpdateMeRq:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 64
    Session:
      type: object
      required:
        - id
        - client
        - createdAt
        - lastSeenAt
        - current
      properties:
        id:
          $ref: _shared.yaml#/components/schemas/Uuid
        client:
          $ref: "#/components/schemas/ClientKind"
        deviceName:
          type: string
        ipCountry:
          type: string
        createdAt:
          $ref: _shared.yaml#/components/schemas/Instant
        lastSeenAt:
          $ref: _shared.yaml#/components/schemas/Instant
        current:
          type: boolean
    SessionsRs:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
