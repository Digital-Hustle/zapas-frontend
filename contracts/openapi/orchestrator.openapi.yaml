          type: string
          maxLength: 100
        settings:
          $ref: "#/components/schemas/ForecastSettings"
        scope:
          $ref: "#/components/schemas/ForecastScope"
        startBalance:
          $ref: "#/components/schemas/Money"
        startBalanceDate:
          $ref: "#/components/schemas/Date"
        historyFrom:
          $ref: "#/components/schemas/Date"
        dailyHistory:
          type: array
          items:
            $ref: "#/components/schemas/DailyActualRs"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotPayment"
        knownPlans:
          type: array
          items:
            $ref: "#/components/schemas/ExpectedPaymentRs"
        recurringPatterns:
          type: array
          items:
            $ref: "#/components/schemas/RecurringPatternRs"
        completeRanges:
          type: array
          items:
            $ref: "#/components/schemas/CompletenessRangeRs"
        calibrationOrigins:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationOriginSnapshot"
          description:
            Зрелые исторические origins, подготовленные Orchestrator для калибровки риска. Только input на
            cutoff и outcomes для scoring. Пустой массив означает отсутствие калибровки, а не восстановление прошлого
            из текущих правок.
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - snapshotId
        - companyId
        - accountId
        - asOfDate
        - inputDataVersion
        - algorithmVersion
        - settings
        - scope
        - startBalance
        - startBalanceDate
        - historyFrom
        - dailyHistory
        - payments
        - knownPlans
        - recurringPatterns
        - completeRanges
        - calibrationOrigins
        - fingerprint
      description:
        "Input только до cutoff: известные планы, регулярности, категории и полнота в состоянии на cutoff; история
        для residual calibration не содержит операций после cutoff. calibrationOrigins содержит отдельные входы исторических
        origins; результат оцениваемых 30 дней не может попасть в их features."
    CalibrationOriginSnapshot:
      type: object
      additionalProperties: false
      properties:
        input:
          allOf:
            - $ref: "#/components/schemas/ForecastSnapshot"
            - type: object
              properties:
                calibrationOrigins:
                  type: array
                  maxItems: 0
                  description: Вложенная калибровка запрещена; origin считается точечной моделью без рекурсивного bootstrap.
        actualDays:
          type: array
          items:
            $ref: "#/components/schemas/DailyActualRs"
          minItems: 30
          maxItems: 30
        actualPayments:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotPayment"
      required:
        - input
        - actualDays
        - actualPayments
      description:
        "Один зрелый исторический origin для калибровки. input.asOfDate — cutoff origin, input.asOfDate+30≤asOfDate
        внешнего snapshot. input содержит только состояние, известное на cutoff: совпадают companyId/accountId/algorithmVersion,
        settings.windowWeeks и правила категоризации той эпохи; поздние USER overrides, планы и регулярности не переносятся.
        input.calibrationOrigins обязан быть пустым. actualDays (ровно 30 полных дней origin+1…origin+30) и actualPayments
        тех же дней служат только scoring ошибок и никогда не передаются как features. Если корректное состояние origin
        восстановить нельзя, origin не включается; при нехватке origins probability=null, а не утёкшая оценка."
    BacktestSnapshot:
      type: object
      additionalProperties: false
      properties:
        snapshotId:
          $ref: "#/components/schemas/Id"
        companyId:
          $ref: "#/components/schemas/Id"
        accountId:
          $ref: "#/components/schemas/Id"
        inputDataVersion:
          type: integer
          minimum: 0
        request:
          $ref: "#/components/schemas/BacktestRq"
        settings:
          $ref: "#/components/schemas/ForecastSettings"
        originSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/ForecastSnapshot"
        actualDays:
          type: array
          items:
            $ref: "#/components/schemas/DailyActualRs"
      required:
        - snapshotId
        - companyId
        - accountId
        - inputDataVersion
        - request
        - settings
        - originSnapshots
        - actualDays
    RecurringDetectionInput:
      type: object
      additionalProperties: false
      properties:
        accountId:
