components:
  schemas:
    Id:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    Instant:
      type: string
      format: date-time
    Money:
      type: string
      description: Рубли с двумя десятичными знаками; отрицательные допустимы для остатка/ошибки. Все вычисления decimal.
      pattern: ^-?(0|[1-9][0-9]{0,16})\.[0-9]{2}$
      examples:
        - "125000.00"
    PositiveMoney:
      type: string
      description: Сумма больше нуля; дополнительная decimal-валидация >0.
      pattern: ^(0|[1-9][0-9]{0,16})\.[0-9]{2}$
      not:
        const: "0.00"
      examples:
        - "125000.00"
    Probability:
      type: number
      minimum: 0
      maximum: 1
    Role:
      type: string
      enum:
        - OWNER
        - ACCOUNTANT
        - VIEWER
    Direction:
      type: string
      enum:
        - IN
        - OUT
    LegalForm:
      type: string
      enum:
        - OOO
        - IP
        - OTHER
    CategorySource:
      type: string
      enum:
        - RULE
        - COUNTERPARTY
        - USER
        - OTHER
    ImportStatus:
      type: string
      enum:
        - RECEIVING
        - STAGING
        - COMMITTED
        - REJECTED
        - ABORTED
    IssueSeverity:
      type: string
      enum:
        - INFO
        - WARNING
        - ERROR
    DataQuality:
      type: string
      enum:
        - GOOD
        - LIMITED
        - INSUFFICIENT
    Completeness:
      type: string
      enum:
        - CONFIRMED_COMPLETE
        - UNKNOWN
    PaymentSource:
      type: string
      enum:
        - MANUAL
        - INVOICE
        - TAX
        - CONTRACT
    PlanStatus:
      type: string
      enum:
        - OPEN
        - PARTIALLY_SETTLED
        - SETTLED
        - CANCELLED
    PlanRelation:
      type: string
      enum:
        - ADDITIONAL
        - REPLACES_RECURRING
        - REPLACES_BASELINE
    Frequency:
      type: string
      enum:
        - WEEKLY
        - MONTHLY
    PatternStatus:
      type: string
      enum:
        - DETECTED
        - CONFIRMED
        - EXCLUDED
    BusinessDayRule:
      type: string
      enum:
        - NONE
        - FOLLOWING
    JobType:
      type: string
      enum:
        - FORECAST
        - BACKTEST
        - DETECT_RECURRING
    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    RiskAvailability:
      type: string
      enum:
        - AVAILABLE
        - INSUFFICIENT_HISTORY
        - INPUT_INCOMPLETE
    RiskMethod:
      type: string
      enum:
        - HISTORICAL_TRAJECTORY_BOOTSTRAP
    AlertType:
      type: string
      enum:
        - CASH_GAP
        - BUFFER_BREACH
        - OVERDUE_PLAN
        - STALE_FORECAST
        - DATA_QUALITY
    ForecastScope:
      type: string
      enum:
        - HISTORY_ONLY
        - WITH_KNOWN_PLANS
    ExternalSource:
      type: string
      enum:
        - ACCOUNTING_EXPORT
        - INVOICE_REGISTER
        - TAX_REGISTER
    WarningCode:
      type: string
      enum:
        - SHORT_HISTORY
        - MISSING_DATA
        - BALANCE_MISMATCH
        - NO_BASELINE_OBSERVATIONS
        - UNMATCHED_PLAN
        - ASSUMED_FIXED_PLAN_DATES
        - RISK_UNAVAILABLE
        - ESTIMATED_PROBABILITY
    DailyStatus:
      type: string
      enum:
        - OBSERVED
        - ZERO_CONFIRMED
        - MISSING
    Algorithm:
      type: string
      enum:
        - WEEKDAY_MEAN_V1
    BacktestStatus:
      type: string
      enum:
        - PARTIAL
        - COMPLETE
    RecommendationKind:
      type: string
      enum:
        - REVIEW_PLAN_DATE
        - REQUEST_PAYMENT
        - REVIEW_VARIABLE_COSTS
    Staleness:
      type: string
      enum:
        - CURRENT
        - STALE
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - AUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - VERSION_CONFLICT
        - PRECONDITION_REQUIRED
        - IDEMPOTENCY_CONFLICT
        - IMPORT_REJECTED
        - IMPORT_INCOMPLETE
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - DUPLICATE_CONFLICT
        - INSUFFICIENT_HISTORY
        - BALANCE_ANCHOR_REQUIRED
        - UNRESOLVED_PLAN
        - DEPENDENCY_UNAVAILABLE
        - RATE_LIMITED
        - JOB_NOT_CANCELLABLE
        - ACCOUNT_ARCHIVED
        - ALLOCATION_EXCEEDS_AMOUNT
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 500
      required:
        - field
        - code
        - message
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 100
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
          maxLength: 2000
        traceId:
          type: string
          maxLength: 100
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        retryAfterSec:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        resourceId:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
      required:
        - type
        - title
        - status
        - code
        - detail
        - traceId
        - errors
        - retryAfterSec
        - resourceId
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        page:
