openapi: 3.1.0
info:
  title: Zapas ledger
  version: 1.0.0
  description: Импорт выписок, качество данных, операции, категории, правила, контрагенты, регулярные операции. Владелец B3.
servers:
  - url: /api/v1/ledger
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /companies/{companyId}/imports:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    post:
      tags: [imports]
      operationId: createImport
      summary: Загрузить выписку (CSV, XLSX, 1С ClientBankExchange), асинхронно
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'до 20 МБ' }
                mappingId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
                mapping: { $ref: '#/components/schemas/ColumnMapping' }
      responses:
        '202':
          description: Принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '413': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
        '415': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_shared.yaml#/components/responses/TooMany' }
    get:
      tags: [imports]
      operationId: listImports
      parameters:
        - $ref: '_shared.yaml#/components/parameters/Page'
        - $ref: '_shared.yaml#/components/parameters/Size'
      responses:
        '200':
          description: История импортов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportsPage' }
  /companies/{companyId}/imports/preview:
    post:
      tags: [imports]
      operationId: previewImport
      summary: Определить формат и колонки, первые 20 строк (без сохранения)
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '415': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/imports/{importId}:
    get:
      tags: [imports]
      operationId: getImport
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: importId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Статус и отчёт о качестве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/demo:
    post:
      tags: [imports]
      operationId: loadDemoData
      summary: Загрузить демо-выписку (только при DEMO_ENABLED=true)
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: profile, in: query, schema: { type: string, enum: [coffee, wholesale, it, manufacturing], default: coffee } }
      responses:
        '202':
          description: Принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/data-quality:
    get:
      tags: [imports]
      operationId: getDataQuality
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      responses:
        '200':
          description: Сводное качество данных компании
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataQuality' }
  /companies/{companyId}/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/Cursor'
        - $ref: '_shared.yaml#/components/parameters/Limit'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
        - { name: direction, in: query, schema: { $ref: '_shared.yaml#/components/schemas/Direction' } }
        - { name: category, in: query, schema: { type: string, maxLength: 64 } }
        - { name: counterpartyId, in: query, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
        - { name: needsReview, in: query, schema: { type: boolean } }
        - $ref: '_shared.yaml#/components/parameters/Query'
      responses:
        '200':
          description: Операции, новые сверху
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionsPage' }
  /companies/{companyId}/transactions/export:
    get:
      tags: [transactions]
      operationId: exportTransactions
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
      responses:
        '200':
          description: CSV (UTF-8 BOM, ;), формулы экранированы
          content:
            text/csv:
              schema: { type: string, format: binary }
  /companies/{companyId}/transactions/{transactionId}/category:
    put:
      tags: [transactions]
      operationId: setTransactionCategory
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: transactionId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryCode, applyToSimilar]
              properties:
                categoryCode: { type: string, maxLength: 64 }
                applyToSimilar: { type: boolean, description: 'Создать правило и применить ко всем похожим' }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                required: [transaction, affectedCount]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  affectedCount: { type: integer }
                  ruleId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Системный справочник (дерево)
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /companies/{companyId}/rules:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [categories]
      operationId: listRules
      responses:
        '200':
          description: Правила компании
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CategoryRule' } }
    post:
      tags: [categories]
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRuleRq' }
      responses:
        '201':
          description: Создано и применено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryRule' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/rules/{ruleId}:
    delete:
      tags: [categories]
      operationId: deleteRule
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: ruleId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '204': { description: 'Удалено' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/counterparties:
    get:
      tags: [counterparties]
      operationId: listCounterparties
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/Query'
        - $ref: '_shared.yaml#/components/parameters/Page'
        - $ref: '_shared.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Контрагенты с агрегатами
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterpartiesPage' }
  /companies/{companyId}/counterparties/options:
    get:
      tags: [counterparties]
      operationId: counterpartyOptions
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/Query'
        - $ref: '_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Для комбобоксов
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Options' }
  /companies/{companyId}/recurring:
    get:
      tags: [recurring]
      operationId: listRecurring
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecurringStatus' } }
      responses:
        '200':
          description: Найденные регулярные операции
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RecurringPattern' } }
  /companies/{companyId}/recurring/{patternId}:
    patch:
      tags: [recurring]
      operationId: updateRecurring
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: patternId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/RecurringStatus' }
                amountOverride: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
                dayOfMonthOverride: { type: integer, minimum: 1, maximum: 31 }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringPattern' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /internal/v1/companies/{companyId}/daily-series:
    get:
      tags: [internal]
      operationId: internalDailySeries
      security:
        - serviceAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
      responses:
        '200':
          description: Дневной ряд без дыр + разбивка по категориям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySeries' }
  /internal/v1/companies/{companyId}/transactions:
    get:
      tags: [internal]
      operationId: internalTransactions
      security:
        - serviceAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
      responses:
        '200':
          description: Операции периода (для план-факта)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
  /internal/v1/companies/{companyId}/recurring:
    get:
      tags: [internal]
      operationId: internalRecurring
      security:
        - serviceAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      responses:
        '200':
          description: Подтверждённые и авто (confidence ≥ 0.8) регулярные
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RecurringPattern' } }
components:
  securitySchemes:
    cookieAuth:
      $ref: '_shared.yaml#/components/securitySchemes/cookieAuth'
    bearerAuth:
      $ref: '_shared.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: '_shared.yaml#/components/securitySchemes/serviceAuth'
  schemas:
    ImportStatus:
      type: string
      enum: [QUEUED, PARSING, CATEGORIZING, SUCCEEDED, FAILED]
    ImportFormat:
      type: string
      enum: [CSV, XLSX, ONEC_CLIENT_BANK]
    ColumnMapping:
      type: object
      required: [date]
      properties:
        date: { type: string }
        amount: { type: string, description: 'Знаковая сумма или модуль при наличии direction' }
        inflow: { type: string }
        outflow: { type: string }
        direction: { type: string }
        counterpartyName: { type: string }
        counterpartyInn: { type: string }
        purpose: { type: string }
        balanceEod: { type: string }
        externalId: { type: string }
        dateFormat: { type: string, examples: [dd.MM.yyyy, yyyy-MM-dd] }
        decimalSeparator: { type: string, enum: [',', '.'] }
    ImportPreview:
      type: object
      required: [format, columns, sampleRows, suggestedMapping, mappingConfidence]
      properties:
        format: { $ref: '#/components/schemas/ImportFormat' }
        encoding: { type: string }
        delimiter: { type: string }
        columns: { type: array, items: { type: string } }
        sampleRows:
          type: array
          maxItems: 20
          items: { type: array, items: { type: string } }
        suggestedMapping: { $ref: '#/components/schemas/ColumnMapping' }
        mappingConfidence: { $ref: '_shared.yaml#/components/schemas/Probability' }
    QualityIssue:
      type: object
      required: [code, severity, count, message]
      properties:
        code:
          type: string
          enum: [BALANCE_MISMATCH, MISSING_DAYS, DUPLICATE_ROWS, EMPTY_COUNTERPARTY, OUTLIER_AMOUNT, SHORT_HISTORY, FUTURE_DATES, PARSE_ERROR]
        severity: { type: string, enum: [INFO, WARNING, ERROR] }
        count: { type: integer }
        message: { type: string }
        action: { type: string }
        sample:
          type: array
          maxItems: 5
          items: { type: string }
    Import:
      type: object
      required: [id, status, progress, fileName, createdAt]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        format: { $ref: '#/components/schemas/ImportFormat' }
        fileName: { type: string }
        rowsTotal: { type: integer }
        rowsImported: { type: integer }
        rowsSkipped: { type: integer }
        rowsDuplicate: { type: integer }
        periodFrom: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        periodTo: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        issues: { type: array, items: { $ref: '#/components/schemas/QualityIssue' } }
        problem: { $ref: '_shared.yaml#/components/schemas/Problem' }
        createdAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
    ImportsPage:
      allOf:
        - $ref: '_shared.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Import' } }
    DataQuality:
      type: object
      required: [level, historyDays, issues]
      properties:
        level: { type: string, enum: [NONE, LOW, MEDIUM, HIGH] }
        historyDays: { type: integer }
        periodFrom: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        periodTo: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        lastBalance: { $ref: '_shared.yaml#/components/schemas/Money' }
        lastBalanceDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        categorizedShare: { $ref: '_shared.yaml#/components/schemas/Probability' }
        needsReviewCount: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/QualityIssue' } }
    CategorySource:
      type: string
      enum: [USER, RULE, SYSTEM_RULE, COUNTERPARTY, AI, NONE]
    Transaction:
      type: object
      required: [id, date, amount, direction, categoryCode, categoryConfidence, categorySource]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        externalId: { type: string, maxLength: 200 }
        accountId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        counterpartyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        counterpartyName: { type: string }
        counterpartyInn: { type: string }
        purpose: { type: string }
        balanceEod: { $ref: '_shared.yaml#/components/schemas/Money' }
        categoryCode: { type: string }
        categoryConfidence: { $ref: '_shared.yaml#/components/schemas/Probability' }
        categorySource: { $ref: '#/components/schemas/CategorySource' }
        recurringPatternId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        importId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
    TransactionsPage:
      type: object
      required: [items, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        nextCursor: { type: [string, 'null'] }
        totals:
          type: object
          required: [inflow, outflow, count]
          properties:
            inflow: { $ref: '_shared.yaml#/components/schemas/Money' }
            outflow: { $ref: '_shared.yaml#/components/schemas/Money' }
            count: { type: integer, format: int64 }
    Category:
      type: object
      required: [code, name, direction, essential]
      properties:
        code: { type: string, examples: [REVENUE_ACQUIRING, PAYROLL, TAX_ENP, RENT] }
        name: { type: string }
        parentCode: { type: [string, 'null'] }
        direction: { type: string, enum: [IN, OUT, BOTH] }
        essential: { type: boolean, description: 'Обязательный платёж (зарплата, налоги, аренда, кредит)' }
        icon: { type: string, description: 'имя иконки lucide' }
    RuleMatch:
      type: object
      properties:
        counterpartyInn: { type: string }
        counterpartyNameContains: { type: string, maxLength: 200 }
        purposeContains: { type: string, maxLength: 200 }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
    CategoryRuleRq:
      type: object
      required: [match, categoryCode]
      properties:
        match: { $ref: '#/components/schemas/RuleMatch' }
        categoryCode: { type: string }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100 }
    CategoryRule:
      allOf:
        - $ref: '#/components/schemas/CategoryRuleRq'
        - type: object
          required: [id, matchedCount, createdAt]
          properties:
            id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
            matchedCount: { type: integer }
            createdAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
    CounterpartyStatus:
      type: string
      enum: [ACTIVE, LIQUIDATING, LIQUIDATED, BANKRUPT, UNKNOWN]
    Counterparty:
      type: object
      required: [id, name, inflowTotal, outflowTotal, operationsCount]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        name: { type: string }
        inn: { type: string }
        inflowTotal: { $ref: '_shared.yaml#/components/schemas/Money' }
        outflowTotal: { $ref: '_shared.yaml#/components/schemas/Money' }
        operationsCount: { type: integer }
        revenueShare: { $ref: '_shared.yaml#/components/schemas/Probability' }
        avgPaymentDelayDays: { type: [number, 'null'] }
        delayRisk: { $ref: '_shared.yaml#/components/schemas/Probability' }
        status: { $ref: '#/components/schemas/CounterpartyStatus' }
        lastOperationDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
    CounterpartiesPage:
      allOf:
        - $ref: '_shared.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Counterparty' } }
    RecurringStatus:
      type: string
      enum: [SUGGESTED, CONFIRMED, REJECTED, AUTO]
    RecurringPattern:
      type: object
      required: [id, direction, categoryCode, period, amount, confidence, status, occurrences]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        title: { type: string, examples: ['Аренда — ООО «Плаза»'] }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        counterpartyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        counterpartyName: { type: string }
        categoryCode: { type: string }
        period: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY] }
        dayOfMonth: { type: [integer, 'null'] }
        dayOfWeek: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        amountVariable: { type: boolean }
        confidence: { $ref: '_shared.yaml#/components/schemas/Probability' }
        status: { $ref: '#/components/schemas/RecurringStatus' }
        occurrences: { type: integer }
        lastDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        nextDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
    DailyPoint:
      type: object
      required: [date, inflow, outflow, balance, observed]
      properties:
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        inflow: { $ref: '_shared.yaml#/components/schemas/Money' }
        outflow: { $ref: '_shared.yaml#/components/schemas/Money' }
        balance: { $ref: '_shared.yaml#/components/schemas/Money' }
        observed: { type: boolean, description: 'false — день восстановлен (нет операций/выписки)' }
        recurringInflow: { $ref: '_shared.yaml#/components/schemas/Money' }
        recurringOutflow: { $ref: '_shared.yaml#/components/schemas/Money' }
        outlierAmount: { $ref: '_shared.yaml#/components/schemas/Money' }
    DailySeries:
      type: object
      required: [companyId, points, byCategory]
      properties:
        companyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        fingerprint: { type: string, description: 'хеш данных для кэша' }
        points: { type: array, items: { $ref: '#/components/schemas/DailyPoint' } }
        byCategory:
          type: object
          description: categoryCode → суммы по дням (те же даты)
          additionalProperties:
            type: array
            items: { $ref: '_shared.yaml#/components/schemas/Money' }
