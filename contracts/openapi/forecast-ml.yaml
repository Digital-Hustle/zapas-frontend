openapi: 3.1.0
info:
  title: Zapas forecast-ml (internal)
  version: 1.0.0
  description: |
    Python-сервис моделей. Вызывается только сервисом forecast с сервисным JWT. Без БД, без пользовательских данных кроме переданных.
    Деньги — строки (как везде), внутри сервиса — Decimal на входе/выходе, float64 только в numpy-расчётах.
    Владелец B2.
servers:
  - url: http://forecast-ml:8090
security:
  - serviceAuth: []
paths:
  /internal/v1/forecast:
    post:
      operationId: mlForecast
      summary: Прогноз остатка + Monte Carlo + риски для одной компании
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForecastRequest' }
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastResponse' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /internal/v1/backtest:
    post:
      operationId: mlBacktest
      summary: Rolling-origin бэктест (синхронно для одной компании, асинхронно для датасета)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacktestRequest' }
      responses:
        '200':
          description: Отчёт (режим COMPANY)
          content:
            application/json:
              schema: { $ref: 'forecast.yaml#/components/schemas/BacktestReport' }
        '202':
          description: Запущен (режим DATASET)
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Job' }
  /internal/v1/jobs/{jobId}:
    get:
      operationId: mlJob
      parameters:
        - { name: jobId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Статус; result — BacktestReport при SUCCEEDED
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/Job'
                  - type: object
                    properties:
                      result: { $ref: 'forecast.yaml#/components/schemas/BacktestReport' }
  /internal/v1/categorize:
    post:
      operationId: mlCategorize
      summary: Классификация операций, не распознанных правилами (батч до 200)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, categories]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id, direction, purpose]
                    properties:
                      id: { type: string }
                      direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
                      purpose: { type: string, maxLength: 2000, description: 'Уже маскированное назначение' }
                      counterpartyName: { type: string }
                      amountBucket: { type: string, enum: [LT_10K, '10K_50K', '50K_200K', '200K_1M', GT_1M] }
                      dayOfMonth: { type: integer }
                categories:
                  type: array
                  items:
                    type: object
                    required: [code, name, direction]
                    properties:
                      code: { type: string }
                      name: { type: string }
                      direction: { type: string }
                      hint: { type: string }
      responses:
        '200':
          description: Результаты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, categoryCode, confidence, provider]
                      properties:
                        id: { type: string }
                        categoryCode: { type: string }
                        confidence: { $ref: '_shared.yaml#/components/schemas/Probability' }
                        provider: { type: string }
                        internalTransfer: { $ref: '_shared.yaml#/components/schemas/Probability' }
  /health:
    get:
      operationId: mlHealth
      security: []
      responses:
        '200':
          description: OK + загруженные модели
          content:
            application/json:
              schema:
                type: object
                required: [status, models]
                properties:
                  status: { type: string, enum: [UP, DEGRADED] }
                  models: { type: array, items: { type: string } }
components:
  securitySchemes:
    cookieAuth:
      $ref: '_shared.yaml#/components/securitySchemes/cookieAuth'
    bearerAuth:
      $ref: '_shared.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: '_shared.yaml#/components/securitySchemes/serviceAuth'
  schemas:
    SeriesPoint:
      type: object
      required: [date, inflow, outflow, balance]
      properties:
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        inflow: { $ref: '_shared.yaml#/components/schemas/Money', description: 'Остаточный приход (без регулярных и известных)' }
        outflow: { $ref: '_shared.yaml#/components/schemas/Money' }
        balance: { $ref: '_shared.yaml#/components/schemas/Money' }
        observed: { type: boolean }
        outlier: { type: boolean }
    KnownEvent:
      type: object
      required: [id, date, amount, direction, probability, source]
      properties:
        id: { type: string }
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        dateTo: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        probability: { $ref: '_shared.yaml#/components/schemas/Probability' }
        amountUncertainty: { type: number, minimum: 0, maximum: 1, description: 'σ относительной суммы (налог-оценка 0.05)' }
        delayDistribution:
          type: array
          description: Эмпирические задержки оплаты в днях (для поступлений от контрагента)
          items: { type: integer }
        nonPaymentProbability: { $ref: '_shared.yaml#/components/schemas/Probability' }
        source: { $ref: '_shared.yaml#/components/schemas/EventSource' }
        essential: { type: boolean }
        title: { type: string }
    Shock:
      $ref: 'planning.yaml#/components/schemas/ScenarioShock'
    ForecastRequest:
      type: object
      required: [companyId, asOf, horizonDays, startBalance, threshold, series, knownEvents]
      properties:
        companyId: { type: string }
        asOf: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        horizonDays: { type: integer, minimum: 7, maximum: 120 }
        startBalance: { $ref: '_shared.yaml#/components/schemas/Money' }
        threshold: { $ref: '_shared.yaml#/components/schemas/Money' }
        series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        knownEvents: { type: array, items: { $ref: '#/components/schemas/KnownEvent' } }
        nonWorkingDays: { type: array, items: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
        keyRatePercent: { type: number }
        model: { $ref: 'forecast.yaml#/components/schemas/ModelName', description: 'Пусто — авто-выбор' }
        shocks: { type: array, items: { $ref: '#/components/schemas/Shock' } }
        simulations: { type: integer, minimum: 200, maximum: 10000, default: 2000 }
        seed: { type: integer, format: int64 }
        cacheKey: { type: string, description: 'Отпечаток ряда для кэша остаточной модели' }
    ForecastResponse:
      type: object
      required: [model, dataQuality, days, gaps, durationMs]
      properties:
        model: { $ref: 'forecast.yaml#/components/schemas/ModelName' }
        dataQuality: { $ref: 'forecast.yaml#/components/schemas/DataQualityLevel' }
        cacheHit: { type: boolean }
        durationMs: { type: integer }
        days:
          type: array
          items:
            type: object
            required: [date, p10, p50, p90, pBelowThreshold, known, residualP50]
            properties:
              date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              p10: { $ref: '_shared.yaml#/components/schemas/Money' }
              p50: { $ref: '_shared.yaml#/components/schemas/Money' }
              p90: { $ref: '_shared.yaml#/components/schemas/Money' }
              pBelowThreshold: { $ref: '_shared.yaml#/components/schemas/Probability' }
              pBelowZero: { $ref: '_shared.yaml#/components/schemas/Probability' }
              known: { $ref: '_shared.yaml#/components/schemas/Money' }
              residualP50: { $ref: '_shared.yaml#/components/schemas/Money' }
              inflowP50: { $ref: '_shared.yaml#/components/schemas/Money' }
              outflowP50: { $ref: '_shared.yaml#/components/schemas/Money' }
        gaps:
          type: array
          items:
            type: object
            required: [kind, threshold, shortfallBasis, startDate, endDate, probability, shortfallP50, shortfallP90, minBalanceDate]
            properties:
              kind: { type: string, enum: [CASH_GAP, BUFFER_BREACH] }
              threshold: { $ref: '_shared.yaml#/components/schemas/Money' }
              shortfallBasis: { type: string, const: CONDITIONAL_ON_BREACH }
              startDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              endDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              minBalanceDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              probability: { $ref: '_shared.yaml#/components/schemas/Probability' }
              shortfallP50: { $ref: '_shared.yaml#/components/schemas/Money' }
              shortfallP90: { $ref: '_shared.yaml#/components/schemas/Money' }
              eventsAtRisk:
                type: array
                description: id поступлений, у которых P(после startDate) > 0.3
                items:
                  type: object
                  required: [id, probabilityLate]
                  properties:
                    id: { type: string }
                    probabilityLate: { $ref: '_shared.yaml#/components/schemas/Probability' }
        runwayDays: { type: [integer, 'null'] }
        warnings: { type: array, items: { type: string } }
    BacktestRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [COMPANY, DATASET] }
        dataset: { type: string }
        company: { $ref: '#/components/schemas/ForecastRequest', description: 'Для COMPANY — полная история' }
        historyEvents:
          type: array
          description: Для COMPANY — известные события с датой, когда они стали известны
          items:
            allOf:
              - $ref: '#/components/schemas/KnownEvent'
              - type: object
                properties:
                  knownSince: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        models: { type: array, items: { $ref: 'forecast.yaml#/components/schemas/ModelName' } }
        horizons: { type: array, items: { type: integer } }
        folds: { type: integer, default: 12 }
        ablation: { type: boolean, default: false }
