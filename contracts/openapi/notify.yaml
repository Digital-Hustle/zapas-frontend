openapi: 3.1.0
info:
  title: Zapas notify
  version: 1.0.0
  description: Уведомления in-app, SSE, настройки каналов, отписка, админ-статистика доставок. Владелец B1.
servers:
  - url: /api/v1/notify
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - $ref: '_shared.yaml#/components/parameters/Cursor'
        - $ref: '_shared.yaml#/components/parameters/Limit'
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
        - { name: companyId, in: query, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Уведомления пользователя
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { type: [string, 'null'] }
                  unreadCount: { type: integer }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 200, items: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
                all: { type: boolean }
      responses:
        '204': { description: 'Готово' }
  /stream:
    get:
      operationId: notificationStream
      summary: SSE-поток событий пользователя
      description: |
        События: `notification` (Notification), `forecast-updated` ({companyId, runId}), `job` (Job), `ping` (каждые 15 с).
        Поддерживает `Last-Event-ID`. Авторизация cookie (web) или Bearer (Android).
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '200':
          description: Поток
          content:
            text/event-stream:
              schema: { type: string }
  /preferences:
    get:
      operationId: getPreferences
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
    put:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /unsubscribe:
    post:
      operationId: unsubscribe
      summary: Отписка по токену из письма (без входа)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        '204': { description: 'Отписан' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /admin/deliveries:
    get:
      operationId: adminDeliveries
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, RETRYING, FAILED] } }
        - $ref: '_shared.yaml#/components/parameters/Cursor'
        - $ref: '_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Доставки (адреса маскированы)
          content:
            application/json:
              schema:
                type: object
                required: [items, stats]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, channel, template, status, attempts, createdAt]
                      properties:
                        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
                        channel: { $ref: '#/components/schemas/Channel' }
                        template: { type: string }
                        recipientMasked: { type: string }
                        status: { type: string }
                        attempts: { type: integer }
                        lastError: { type: string }
                        createdAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
                  nextCursor: { type: [string, 'null'] }
                  stats: { type: object, additionalProperties: { type: integer } }
  /admin/deliveries/{deliveryId}/retry:
    post:
      operationId: adminRetryDelivery
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '202': { description: 'Поставлено в очередь' }
components:
  securitySchemes:
    cookieAuth:
      $ref: '_shared.yaml#/components/securitySchemes/cookieAuth'
    bearerAuth:
      $ref: '_shared.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: '_shared.yaml#/components/securitySchemes/serviceAuth'
  schemas:
    Channel:
      type: string
      enum: [EMAIL, IN_APP, PUSH]
    NotificationKind:
      type: string
      enum: [GAP_NEW, GAP_CHANGED, GAP_RESOLVED, PAYMENT_OVERDUE, BELOW_THRESHOLD, TAX_DUE_SOON, IMPORT_DONE, WEEKLY_DIGEST, INVITATION, SYSTEM]
    Notification:
      type: object
      required: [id, kind, title, createdAt, read]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        companyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        title: { type: string }
        body: { type: string }
        actionUrl: { type: string }
        createdAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
        read: { type: boolean }
    Preferences:
      type: object
      required: [channels, digestEnabled, quietHours]
      properties:
        channels:
          type: object
          description: NotificationKind → включённые каналы
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/Channel' }
        digestEnabled: { type: boolean }
        digestDayOfWeek: { type: integer, minimum: 1, maximum: 7, default: 1 }
        quietHours:
          type: object
          properties:
            from: { type: string, pattern: '^\d{2}:\d{2}$' }
            to: { type: string, pattern: '^\d{2}:\d{2}$' }
