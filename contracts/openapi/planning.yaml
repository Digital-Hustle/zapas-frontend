openapi: 3.1.0
info:
  title: Zapas planning
  version: 1.0.0
  description: Счета, договоры, налоги, ручные события, сценарии, план-факт, банковские данные, внешние интеграции. Владелец B3.
servers:
  - url: /api/v1/planning
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /companies/{companyId}/invoices:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [invoices]
      operationId: listInvoices
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/InvoiceKind' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - $ref: '_shared.yaml#/components/parameters/Page'
        - $ref: '_shared.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Счета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicesPage' }
    post:
      tags: [invoices]
      operationId: createInvoice
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRq' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/invoices/{invoiceId}:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
      - { name: invoiceId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
    put:
      tags: [invoices]
      operationId: updateInvoice
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRq' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
    delete:
      tags: [invoices]
      operationId: deleteInvoice
      responses:
        '204': { description: 'Удалён' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/invoices/{invoiceId}/status:
    post:
      tags: [invoices]
      operationId: setInvoiceStatus
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: invoiceId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/InvoiceStatus' }
                paidDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/contracts:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [contracts]
      operationId: listContracts
      responses:
        '200':
          description: Договоры
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Contract' } }
    post:
      tags: [contracts]
      operationId: createContract
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRq' }
      responses:
        '201':
          description: Создан, график сгенерирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/contracts/{contractId}:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
      - { name: contractId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
    put:
      tags: [contracts]
      operationId: updateContract
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRq' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
    delete:
      tags: [contracts]
      operationId: deleteContract
      responses:
        '204': { description: 'Удалён' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/taxes/settings:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [taxes]
      operationId: getTaxSettings
      responses:
        '200':
          description: Настройки налогов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxSettings' }
    put:
      tags: [taxes]
      operationId: updateTaxSettings
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxSettings' }
      responses:
        '200':
          description: Сохранено, календарь пересчитан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxSettings' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/taxes/obligations:
    get:
      tags: [taxes]
      operationId: listTaxObligations
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
      responses:
        '200':
          description: Налоговые обязательства по календарю
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaxObligation' } }
  /companies/{companyId}/taxes/obligations/{obligationId}:
    patch:
      tags: [taxes]
      operationId: overrideTaxObligation
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: obligationId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountOverride: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
                paid: { type: boolean }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxObligation' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/events:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [events]
      operationId: listPlannedEvents
      summary: Все будущие события из всех источников (для календаря и списков)
      parameters:
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
        - { name: source, in: query, schema: { $ref: '_shared.yaml#/components/schemas/EventSource' } }
        - { name: direction, in: query, schema: { $ref: '_shared.yaml#/components/schemas/Direction' } }
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlannedEvent' } }
    post:
      tags: [events]
      operationId: createManualEvent
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualEventRq' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedEvent' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/events/parse:
    post:
      tags: [events]
      operationId: parseEventText
      summary: Разобрать фразу «клиент обещал 300 000 20-го» в черновик события (не сохраняет)
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Черновик и альтернативы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedEvent' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_shared.yaml#/components/responses/TooMany' }
  /companies/{companyId}/events/{eventId}:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
      - { name: eventId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
    put:
      tags: [events]
      operationId: updateManualEvent
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualEventRq' }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedEvent' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
    delete:
      tags: [events]
      operationId: deleteManualEvent
      responses:
        '204': { description: 'Удалено' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/scenarios:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
    get:
      tags: [scenarios]
      operationId: listScenarios
      responses:
        '200':
          description: Сохранённые сценарии
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Scenario' } }
    post:
      tags: [scenarios]
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioRq' }
      responses:
        '201':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '422': { $ref: '_shared.yaml#/components/responses/Unprocessable' }
  /companies/{companyId}/scenarios/{scenarioId}:
    parameters:
      - $ref: '_shared.yaml#/components/parameters/CompanyId'
      - { name: scenarioId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
    put:
      tags: [scenarios]
      operationId: updateScenario
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioRq' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    delete:
      tags: [scenarios]
      operationId: deleteScenario
      responses:
        '204': { description: 'Удалён' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
  /companies/{companyId}/plan-fact:
    get:
      tags: [plan-fact]
      operationId: getPlanFact
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
        - { name: granularity, in: query, schema: { type: string, enum: [DAY, WEEK], default: WEEK } }
      responses:
        '200':
          description: План-факт по периодам и отклонения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanFact' }
  /companies/{companyId}/bank:
    get:
      tags: [bank]
      operationId: getBankData
      summary: Данные банка (симулятор внутренней интеграции)
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      responses:
        '200':
          description: Кредиты, зарплатный проект, неисполненные платёжки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankData' }
  /companies/{companyId}/bank/sync:
    post:
      tags: [bank]
      operationId: syncBankData
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      responses:
        '200':
          description: Синхронизировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankData' }
        '503': { $ref: '_shared.yaml#/components/responses/Unavailable' }
  /companies/{companyId}/sources:
    get:
      tags: [integrations]
      operationId: listDataSources
      summary: Все источники данных компании и их статус
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
      responses:
        '200':
          description: Источники
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DataSource' } }
  /lookup/party:
    get:
      tags: [integrations]
      operationId: lookupParty
      summary: Карточка организации по ИНН (DaData, кэш 24 ч)
      parameters:
        - { name: inn, in: query, required: true, schema: { type: string, pattern: '^(\d{10}|\d{12})$' } }
      responses:
        '200':
          description: Найдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '429': { $ref: '_shared.yaml#/components/responses/TooMany' }
        '503': { $ref: '_shared.yaml#/components/responses/Unavailable' }
  /reference/macro:
    get:
      tags: [integrations]
      operationId: getMacro
      summary: Ключевая ставка ЦБ и курсы (кэш)
      responses:
        '200':
          description: Макроданные
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Macro' }
  /admin/calendar/{year}:
    get:
      tags: [admin]
      operationId: adminGetCalendar
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer, minimum: 2020, maximum: 2030 } }
      responses:
        '200':
          description: Производственный календарь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCalendar' }
    put:
      tags: [admin]
      operationId: adminUpdateCalendar
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer, minimum: 2020, maximum: 2030 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionCalendar' }
      responses:
        '200':
          description: Сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCalendar' }
  /admin/tax-rates:
    get:
      tags: [admin]
      operationId: adminGetTaxRates
      responses:
        '200':
          description: Ставки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRates' }
    put:
      tags: [admin]
      operationId: adminUpdateTaxRates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRates' }
      responses:
        '200':
          description: Сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRates' }
  /internal/v1/companies/{companyId}/future-events:
    get:
      tags: [internal]
      operationId: internalFutureEvents
      security:
        - serviceAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - $ref: '_shared.yaml#/components/parameters/From'
        - $ref: '_shared.yaml#/components/parameters/To'
        - { name: asOf, in: query, description: 'Для бэктеста — только события, известные на эту дату', schema: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
      responses:
        '200':
          description: Будущие события для прогноза
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FutureEvents' }
  /internal/v1/companies/{companyId}/scenarios/{scenarioId}:
    get:
      tags: [internal]
      operationId: internalScenario
      security:
        - serviceAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CompanyId'
        - { name: scenarioId, in: path, required: true, schema: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Сценарий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
components:
  securitySchemes:
    cookieAuth:
      $ref: '_shared.yaml#/components/securitySchemes/cookieAuth'
    bearerAuth:
      $ref: '_shared.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: '_shared.yaml#/components/securitySchemes/serviceAuth'
  schemas:
    InvoiceKind:
      type: string
      enum: [RECEIVABLE, PAYABLE]
      description: RECEIVABLE — мы выставили клиенту, PAYABLE — нам выставил поставщик
    InvoiceStatus:
      type: string
      enum: [EXPECTED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED]
    InvoiceRq:
      type: object
      required: [kind, counterpartyName, amount, issueDate, dueDate]
      properties:
        kind: { $ref: '#/components/schemas/InvoiceKind' }
        number: { type: string, maxLength: 50 }
        counterpartyName: { type: string, minLength: 1, maxLength: 300 }
        counterpartyInn: { type: string, pattern: '^(\d{10}|\d{12})$' }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        issueDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        dueDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        comment: { type: string, maxLength: 500 }
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceRq'
        - type: object
          required: [id, status, paidAmount, version]
          properties:
            id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/InvoiceStatus' }
            paidAmount: { $ref: '_shared.yaml#/components/schemas/Money' }
            expectedPayDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
            payProbabilityByDue: { $ref: '_shared.yaml#/components/schemas/Probability' }
            matchedTransactionIds: { type: array, items: { $ref: '_shared.yaml#/components/schemas/Uuid' } }
            version: { type: integer }
    InvoicesPage:
      allOf:
        - $ref: '_shared.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items, totals]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
            totals:
              type: object
              required: [receivableOpen, payableOpen, overdue]
              properties:
                receivableOpen: { $ref: '_shared.yaml#/components/schemas/Money' }
                payableOpen: { $ref: '_shared.yaml#/components/schemas/Money' }
                overdue: { $ref: '_shared.yaml#/components/schemas/Money' }
    ScheduleKind:
      type: string
      enum: [ONE_TIME, MONTHLY, QUARTERLY, MILESTONES]
    ContractRq:
      type: object
      required: [kind, counterpartyName, title, totalAmount, startDate, schedule]
      properties:
        kind: { $ref: '#/components/schemas/InvoiceKind' }
        title: { type: string, minLength: 1, maxLength: 200 }
        counterpartyName: { type: string, maxLength: 300 }
        counterpartyInn: { type: string, pattern: '^(\d{10}|\d{12})$' }
        totalAmount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        startDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        endDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        prepaymentPercent: { type: integer, minimum: 0, maximum: 100, default: 0 }
        paymentDelayDays: { type: integer, minimum: 0, maximum: 365, default: 0 }
        schedule: { $ref: '#/components/schemas/ScheduleKind' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        milestones:
          type: array
          maxItems: 50
          items:
            type: object
            required: [date, amount]
            properties:
              date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
              title: { type: string, maxLength: 200 }
    Contract:
      allOf:
        - $ref: '#/components/schemas/ContractRq'
        - type: object
          required: [id, payments, version]
          properties:
            id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
            payments:
              type: array
              items:
                type: object
                required: [date, amount, status]
                properties:
                  date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
                  amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
                  status: { $ref: '#/components/schemas/InvoiceStatus' }
            version: { type: integer }
    TaxSettings:
      type: object
      required: [regime, vatPayer, hasEmployees, estimateFromStatement, version]
      properties:
        regime: { $ref: '_shared.yaml#/components/schemas/TaxRegime' }
        usnRatePercent: { type: number, minimum: 0, maximum: 15 }
        vatPayer: { type: boolean }
        vatMode: { type: string, enum: [STANDARD_22, REDUCED_5, REDUCED_7, EXEMPT] }
        hasEmployees: { type: boolean }
        insuranceRateCode: { type: string, enum: [STANDARD, MSP_PRIORITY, MANUFACTURING], default: STANDARD }
        individualEntrepreneur: { type: boolean }
        estimateFromStatement: { type: boolean, description: 'Оценивать суммы по базе из выписки' }
        version: { type: integer }
    TaxKind:
      type: string
      enum: [ENP, USN_ADVANCE, USN_ANNUAL, VAT, NDFL, INSURANCE, IP_FIXED, IP_ONE_PERCENT, PROFIT_TAX]
    TaxObligation:
      type: object
      required: [id, kind, title, period, dueDate, amount, estimated, paid]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/TaxKind' }
        taxYear: { type: integer }
        ruleVersion: { type: string }
        sourceUrl: { type: string, format: uri }
        title: { type: string, examples: ['НДС за III квартал, 1/3'] }
        period: { type: string, examples: [2026-Q3, 2026-10] }
        dueDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        originalDueDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        noticeDueDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        estimated: { type: boolean }
        basis: { type: string, description: 'Как посчитано', examples: ['Выручка III кв. 2 140 000 ₽ × 6 %'] }
        paid: { type: boolean }
    Recurrence:
      type: object
      required: [period]
      properties:
        period: { type: string, enum: [WEEKLY, MONTHLY, QUARTERLY] }
        until: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        count: { type: integer, minimum: 1, maximum: 60 }
    ManualEventRq:
      type: object
      required: [direction, amount, date, title]
      properties:
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        title: { type: string, minLength: 1, maxLength: 200 }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        dateTo: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        probability: { $ref: '_shared.yaml#/components/schemas/Probability' }
        categoryCode: { type: string }
        counterpartyName: { type: string, maxLength: 300 }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        essential: { type: boolean, description: 'Обязательный платёж, нельзя переносить в рекомендациях' }
    PlannedEvent:
      type: object
      required: [id, source, direction, title, amount, date, probability, essential, status]
      properties:
        id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        economicEventId: { $ref: '_shared.yaml#/components/schemas/Uuid', description: 'Исключает двойной счёт/договор/регулярный/банк учёт' }
        knownSince: { $ref: '_shared.yaml#/components/schemas/Instant' }
        remainingAmount: { $ref: '_shared.yaml#/components/schemas/Money' }
        source: { $ref: '_shared.yaml#/components/schemas/EventSource' }
        sourceId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        title: { type: string }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        amountEstimated: { type: boolean }
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        dateTo: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        probability: { $ref: '_shared.yaml#/components/schemas/Probability' }
        categoryCode: { type: string }
        counterpartyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        counterpartyName: { type: string }
        essential: { type: boolean }
        movable: { type: boolean, description: 'Можно сдвигать в рекомендациях' }
        status: { type: string, enum: [PLANNED, MATCHED, PARTIAL, OVERDUE, CANCELLED] }
        version: { type: integer }
    ParsedEvent:
      type: object
      required: [draft, confidence, alternatives]
      properties:
        draft: { $ref: '#/components/schemas/ManualEventRq' }
        confidence: { $ref: '_shared.yaml#/components/schemas/Probability' }
        provider: { type: string }
        alternatives:
          type: object
          properties:
            amounts: { type: array, items: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' } }
            dates: { type: array, items: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
        warnings: { type: array, items: { type: string } }
    ScenarioShock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [CLIENT_DELAY, REVENUE_DROP, ONE_OFF_EXPENSE, FIXED_COST_INCREASE, EVENT_SHIFT] }
        counterpartyId: { $ref: '_shared.yaml#/components/schemas/Uuid', description: 'CLIENT_DELAY — конкретный клиент; пусто — все крупные' }
        delayDays: { type: integer, minimum: 1, maximum: 90 }
        percent: { type: number, minimum: 1, maximum: 90 }
        amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        fromDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        categoryCodes: { type: array, items: { type: string } }
        eventId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        shiftDays: { type: integer, minimum: -90, maximum: 90 }
        title: { type: string, maxLength: 200 }
    ScenarioRq:
      type: object
      required: [name, shocks]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        shocks:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ScenarioShock' }
    Scenario:
      allOf:
        - $ref: '#/components/schemas/ScenarioRq'
        - type: object
          required: [id, createdAt, version]
          properties:
            id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
            createdAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
            version: { type: integer }
    PlanFactBucket:
      type: object
      required: [from, to, plannedIn, actualIn, plannedOut, actualOut]
      properties:
        from: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        to: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        plannedIn: { $ref: '_shared.yaml#/components/schemas/Money' }
        actualIn: { $ref: '_shared.yaml#/components/schemas/Money' }
        plannedOut: { $ref: '_shared.yaml#/components/schemas/Money' }
        actualOut: { $ref: '_shared.yaml#/components/schemas/Money' }
        deviationPercent: { type: number }
        significant: { type: boolean, description: '|отклонение| ≥ 15 %' }
    PlanFactItem:
      type: object
      required: [eventId, title, plannedDate, plannedAmount, status]
      properties:
        eventId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        title: { type: string }
        source: { $ref: '_shared.yaml#/components/schemas/EventSource' }
        direction: { $ref: '_shared.yaml#/components/schemas/Direction' }
        plannedDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        plannedAmount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
        actualDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        actualAmount: { $ref: '_shared.yaml#/components/schemas/Money' }
        status: { type: string, enum: [MATCHED, PARTIAL, OVERDUE, PENDING] }
        overdueDays: { type: integer }
    PlanFact:
      type: object
      required: [buckets, items]
      properties:
        buckets: { type: array, items: { $ref: '#/components/schemas/PlanFactBucket' } }
        items: { type: array, items: { $ref: '#/components/schemas/PlanFactItem' } }
        accuracyPercent: { type: number, description: 'Доля плана, исполненного в срок ±5 дней' }
    BankData:
      type: object
      required: [loans, payroll, pendingOrders, syncedAt, simulated]
      properties:
        simulated: { type: boolean, description: 'true — данные симулятора, помечаются в UI' }
        syncedAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
        loans:
          type: array
          items:
            type: object
            required: [id, title, balance, payments]
            properties:
              id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
              title: { type: string }
              balance: { $ref: '_shared.yaml#/components/schemas/Money' }
              ratePercent: { type: number }
              payments:
                type: array
                items:
                  type: object
                  required: [date, principal, interest]
                  properties:
                    date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
                    principal: { $ref: '_shared.yaml#/components/schemas/Money' }
                    interest: { $ref: '_shared.yaml#/components/schemas/Money' }
        payroll:
          type: object
          properties:
            employees: { type: integer }
            monthlyAmount: { $ref: '_shared.yaml#/components/schemas/Money' }
            days: { type: array, items: { type: integer } }
        pendingOrders:
          type: array
          items:
            type: object
            required: [id, date, amount, recipient]
            properties:
              id: { $ref: '_shared.yaml#/components/schemas/Uuid' }
              date: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
              amount: { $ref: '_shared.yaml#/components/schemas/PositiveMoney' }
              recipient: { type: string }
              purpose: { type: string }
    DataSource:
      type: object
      required: [kind, title, status]
      properties:
        kind: { type: string, enum: [STATEMENT, ONEC, INVOICES, CONTRACTS, TAXES, MANUAL, BANK, DADATA, CBR, CALENDAR, AI] }
        title: { type: string }
        status: { type: string, enum: [OK, STALE, ERROR, DISABLED, NOT_CONNECTED] }
        itemsCount: { type: integer }
        lastSyncAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
        message: { type: string }
    Party:
      type: object
      required: [inn, name, status]
      properties:
        inn: { type: string }
        ogrn: { type: string }
        name: { type: string }
        shortName: { type: string }
        status: { type: string, enum: [ACTIVE, LIQUIDATING, LIQUIDATED, BANKRUPT, REORGANIZING, UNKNOWN] }
        registeredAt: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        okved: { type: string }
        address: { type: string }
        msp: { type: boolean }
        cachedAt: { $ref: '_shared.yaml#/components/schemas/Instant' }
    Macro:
      type: object
      required: [keyRatePercent, keyRateDate]
      properties:
        keyRatePercent: { type: number }
        keyRateDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
        usdRub: { type: number }
        eurRub: { type: number }
        cnyRub: { type: number }
        ratesDate: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
    ProductionCalendar:
      type: object
      required: [year, nonWorkingDays, shortDays, workingWeekends]
      properties:
        year: { type: integer }
        nonWorkingDays: { type: array, items: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
        shortDays: { type: array, items: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
        workingWeekends: { type: array, items: { $ref: '_shared.yaml#/components/schemas/LocalDate' } }
        source: { type: string }
    TaxRates:
      type: object
      required: [vatStandardPercent, usnIncomePercent, usnIncomeMinusExpensesPercent, insuranceStandardPercent, ipFixedContribution]
      properties:
        vatStandardPercent: { type: number, examples: [22] }
        usnIncomePercent: { type: number, examples: [6] }
        usnIncomeMinusExpensesPercent: { type: number, examples: [15] }
        insuranceStandardPercent: { type: number, examples: [30] }
        insuranceAboveCapPercent: { type: number, examples: [15.1] }
        insuranceCap: { $ref: '_shared.yaml#/components/schemas/Money' }
        ipFixedContribution: { $ref: '_shared.yaml#/components/schemas/Money' }
        ndflPercent: { type: number, examples: [13] }
    FutureEvents:
      type: object
      required: [companyId, fingerprint, events, minBalance]
      properties:
        companyId: { $ref: '_shared.yaml#/components/schemas/Uuid' }
        fingerprint: { type: string }
        minBalance: { $ref: '_shared.yaml#/components/schemas/Money' }
        events: { type: array, items: { $ref: '#/components/schemas/PlannedEvent' } }
        counterpartyDelays:
          type: object
          description: counterpartyId → эмпирические задержки оплат, дни
          additionalProperties:
            type: array
            items: { type: integer }
        nonWorkingDays:
          type: array
          description: Нерабочие дни горизонта
          items: { $ref: '_shared.yaml#/components/schemas/LocalDate' }
