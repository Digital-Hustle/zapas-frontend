name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  LEFTHOOK: "0"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/check.mjs contracts frontend tooling
      - name: Personal PR authorship
        run: node tools/ci/authorship.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    name: summary
    if: always()
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - env:
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$FRONTEND" = success
          echo "Tokens, lint, types, tests, build, contracts and guard passed." >> "$GITHUB_STEP_SUMMARY"